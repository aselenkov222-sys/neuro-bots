[project]
name = "server"
version = "0.1.0"
requires-python = ">=3.15,<3.16"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.163.1",
    "psycopg[binary]>=3",
    "pwdlib[argon2]==0.4.0",
    "sqlalchemy>=2.0.52,<2.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "playwright>=1.65.2",
    "pytest>=9.2.0",
]
