services:
  postgres:
    image: postgres:17
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: neurobots
      POSTGRES_DB: neurobots
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neurobots -d neurobots"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
