<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Боты — кликабельный макет</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%23c2410c'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700&family=Unbounded:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
    (function () {
      try {
        var stored = localStorage.getItem("nb-theme");
        var query = new URLSearchParams(location.search).get("theme");
        var theme = stored === "dark" || stored === "light" ? stored : query;
        if (theme === "dark" || theme === "light") {
          document.documentElement.dataset.theme = theme;
        }
      } catch (error) {}
      if (!location.hash) location.replace("#chat");
    })();
  </script>
</head>
<body>
  <div class="stage">
    <header class="proto">
      <p class="proto-brand">
        <strong>Макет</strong>
        <span>Главный экран — чаты. Остальные экраны пока в прежнем виде.</span>
      </p>
      <nav class="proto-nav" aria-label="Экраны макета">
        <a href="#chat" data-screen>Чаты</a>
        <a href="#bots" data-screen>Боты</a>
        <a href="#bot" data-screen>Карточка</a>
        <a href="#tariff" data-screen>Тариф</a>
        <a href="#password" data-screen>Пароль</a>
      </nav>
      <div class="theme-switch" role="group" aria-label="Тема">
        <button type="button" data-theme-set="light">Светлая</button>
        <button type="button" data-theme-set="dark">Тёмная</button>
      </div>
    </header>
    <main id="app" class="window"></main>
  </div>
  <script src="app.js"></script>
</body>
</html>
